<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>bgi-touch 控制台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#111418; --panel:#1a1f26; --line:#2a323c; --fg:#d8dee6; --dim:#8a94a0;
          --acc:#4da3ff; --ok:#3fbf6f; --warn:#e0a63c; --err:#e05c5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  #statline { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns: 1fr 360px; gap:12px; padding:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .panel h2 { font-size:13px; margin:0 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  #screenwrap { position:relative; }
  #screen { width:100%; border-radius:8px; display:block; cursor:crosshair;
            background:#000; min-height:200px; user-select:none; -webkit-user-drag:none; }
  #skillCdLayer { position:absolute; inset:0; overflow:hidden; border-radius:8px;
                  pointer-events:none; }
  .skill-cd { position:absolute; min-width:42px; padding:2px 7px; border-radius:12px;
              text-align:center; font:700 20px/1.25 ui-monospace,Menlo,monospace;
              box-shadow:0 1px 4px #0008; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  button, select, input[type=text] { background:#232a33; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button:active { transform:translateY(1px); }
  button.acc { background:var(--acc); color:#08111c; border-color:var(--acc); font-weight:600; }
  button.stop { background:var(--err); color:#fff; border-color:var(--err); }
  button.hold { background:#2a3a4e; }
  input[type=text] { cursor:text; width:100%; }
  .pad { display:grid; grid-template-columns:repeat(3,44px); gap:6px; justify-content:center; }
  .pad button { height:40px; }
  .keys { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .keys button { min-width:44px; }
  .row { display:flex; gap:8px; align-items:center; margin:6px 0; flex-wrap:wrap; }
  ul.scripts { list-style:none; margin:0; padding:0; max-height:220px; overflow:auto; }
  ul.scripts li { display:flex; align-items:center; gap:8px; padding:5px 4px;
                  border-bottom:1px solid var(--line); font-size:13px; }
  ul.scripts li .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  ul.scripts li .v { color:var(--dim); font-size:11px; }
  #logs { height:200px; overflow:auto; background:#0c0f13; border-radius:6px; padding:8px;
          font:12px/1.5 ui-monospace,Menlo,monospace; white-space:pre-wrap; }
  #mapCanvas { display:block; width:100%; aspect-ratio:16/9; border-radius:8px;
               background:#0c0f13; border:1px solid var(--line); }
  #mapInfo { color:var(--dim); font-size:12px; margin-top:6px; min-height:18px; }
  .tag { padding:1px 8px; border-radius:10px; font-size:11px; }
  .tag.running { background:var(--warn); color:#111; }
  .tag.idle, .tag.done { background:#2a323c; color:var(--dim); }
  .tag.error { background:var(--err); color:#fff; }
  .tag.cancelled { background:#555; color:#ddd; }
  #maskLayer { position:fixed; inset:0; z-index:1000; pointer-events:none; }
  .mask-shell { position:absolute; inset:0; pointer-events:none; }
  .mask-shell iframe { width:100%; height:100%; border:0; background:transparent; }
  .mask-shell:not(.click-through) iframe { pointer-events:auto; }
  .mask-shell.click-through iframe { pointer-events:none; }
  .mask-close { position:absolute; top:8px; right:8px; z-index:2; pointer-events:auto;
                opacity:.65; padding:4px 9px; background:#191d23; color:#fff; }
  .mask-close:hover { opacity:1; }
  @media (max-width: 960px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>bgi-touch 控制台</h1>
  <span id="taskTag" class="tag idle">idle</span>
  <span id="statline">连接中…</span>
  <span style="flex:1"></span>
  <button onclick="connectDevice()">连接设备</button>
  <button onclick="post('/api/launch')">启动原神</button>
  <button class="stop" onclick="post('/api/stop');post('/api/release')">■ 停止</button>
</header>
<div id="maskLayer"></div>
<main>
  <section class="panel">
    <h2>屏幕 · 点击=点按 拖拽=滑动</h2>
    <div id="screenwrap"><img id="screen" alt="screen"><div id="skillCdLayer"></div></div>
    <div class="toolbar">
      <label><input type="checkbox" id="annotate"> 布局标注</label>
      <label>刷新
        <select id="fps"><option value="0">暂停</option><option value="1000" selected>1 fps</option>
          <option value="500">2 fps</option><option value="2000">0.5 fps</option></select>
      </label>
      <span id="shotinfo" style="color:var(--dim);font-size:12px"></span>
    </div>
  </section>

  <div style="display:flex;flex-direction:column;gap:12px">
    <section class="panel">
      <h2>手动控制（按住方向键=持续移动）</h2>
      <div class="pad">
        <span></span><button class="hold" data-key="W">W</button><span></span>
        <button class="hold" data-key="A">A</button><button class="hold" data-key="S">S</button><button class="hold" data-key="D">D</button>
      </div>
      <div class="keys">
        <button onclick="post('/api/attack')">普攻</button>
        <button onclick="key('E')">E</button>
        <button onclick="key('Q')">Q</button>
        <button onclick="key('SPACE')">跳</button>
        <button class="hold" data-key="LSHIFT">冲刺</button>
        <button onclick="key('F')">F</button>
        <button onclick="key('ESCAPE')">菜单</button>
      </div>
      <div class="keys">
        切人：<button onclick="party(1)">1</button><button onclick="party(2)">2</button>
        <button onclick="party(3)">3</button><button onclick="party(4)">4</button>
        视角：<button onclick="cam(-300,0)">←</button><button onclick="cam(300,0)">→</button>
        <button onclick="cam(0,-200)">↑</button><button onclick="cam(0,200)">↓</button>
      </div>
      <div class="keys">
        触发器：<label><input type="checkbox" id="trigPick" onchange="setTrigger()"> 自动拾取</label>
        <label><input type="checkbox" id="trigSkip" onchange="setTrigger()"> 自动剧情</label>
        <label><input type="checkbox" id="trigEat" onchange="setTrigger()"> 自动吃药</label>
        <label><input type="checkbox" id="trigSkillCd" onchange="setSkillCd()"> 技能冷却</label>
        <label><input type="checkbox" id="trigQuickTp" onchange="setTrigger()"> 快速传送</label>
        <button onclick="post('/api/quick-teleport/tick')">单次传送</button>
      </div>
    </section>

    <section class="panel">
      <h2>地图遮罩 · 缓存帧追踪</h2>
      <div class="row">
        <label><input type="checkbox" id="trigMap" onchange="setMapMask()"> 启用追踪</label>
        <select id="mapName" onchange="mapSelectionChanged()">
          <option value="Teyvat">提瓦特</option>
        </select>
      </div>
      <canvas id="mapCanvas" width="640" height="360"></canvas>
      <div id="mapInfo">追踪未启用；地图面板不会主动请求设备截图。</div>
    </section>

    <section class="panel">
      <h2>脚本</h2>
      <div class="row">
        <select id="kind" onchange="loadScripts()">
          <option value="js">JS 脚本包</option><option value="combat">战斗策略</option>
          <option value="keymouse">键鼠宏</option><option value="pathing">pathing</option>
          <option value="task">BetterGI 任务</option>
        </select>
        <button onclick="loadScripts()">刷新</button>
      </div>
      <ul class="scripts" id="scriptList"></ul>
      <div class="row" style="margin-top:8px">
        <input type="text" id="convSrc" placeholder="转换：输入 bettergi-scripts-list 中的路径">
      </div>
      <div class="row"><button class="acc" onclick="convert()">转换到 scripts/</button></div>
    </section>

    <section class="panel">
      <h2>日志</h2>
      <div id="logs"></div>
    </section>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
async function post(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
                              body: body ? JSON.stringify(body) : '{}'});
  if (!r.ok) { const e = await r.json().catch(()=>({})); log(`[ui] ${url} 失败: ${e.error||r.status}`); }
  return r;
}
const key = k => post('/api/key', {key:k, action:'press'});
const party = s => post('/api/party', {slot:s});
const cam = (dx,dy) => post('/api/camera', {dx, dy});
const hookEvent = event => fetch('/api/key-mouse-hook/event', {
  method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(event)
}).catch(() => {});

// WebUI 是 iOS 端的 KeyMouseHook 控制面；事件只进入脚本队列，不发送给游戏。
function hookKey(type, event) {
  hookEvent({type, key:event.key, code:event.code, repeat:event.repeat,
             altKey:event.altKey, ctrlKey:event.ctrlKey,
             shiftKey:event.shiftKey, metaKey:event.metaKey});
}
window.addEventListener('keydown', event => hookKey('keyDown', event), true);
window.addEventListener('keyup', event => hookKey('keyUp', event), true);

// ---- 按住式按键 ----
document.querySelectorAll('button.hold').forEach(b => {
  const k = b.dataset.key; if (!k) return;
  const down = e => { e.preventDefault(); post('/api/key', {key:k, action:'down'}); b.style.borderColor='var(--acc)'; };
  const up = () => { post('/api/key', {key:k, action:'up'}); b.style.borderColor=''; };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointerleave', up);
});

// ---- 屏幕预览：点按/拖拽 ----
const img = $('#screen');
let downPos = null;
function hookPointer(type, event, extra={}) {
  const rect = img.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  hookEvent({type, nx:event.offsetX/rect.width, ny:event.offsetY/rect.height,
             button:event.button, ...extra});
}
img.addEventListener('pointerdown', e => {
  hookPointer('mouseDown', e);
  downPos = [e.offsetX, e.offsetY, Date.now(),
             e.button !== 0 || e.altKey || e.ctrlKey || e.shiftKey || e.metaKey];
});
img.addEventListener('pointerup', e => {
  hookPointer('mouseUp', e);
  if (!downPos) return;
  const [x0, y0, t0, suppressDevice] = downPos; downPos = null;
  if (suppressDevice) return;
  const r = img.getBoundingClientRect();
  const n = (x,y) => [x/r.width, y/r.height];
  const [nx1, ny1] = n(x0, y0), [nx2, ny2] = n(e.offsetX, e.offsetY);
  if (Math.hypot(e.offsetX-x0, e.offsetY-y0) < 8) {
    post('/api/tap', {nx:nx1, ny:ny1}); log(`[ui] tap ${(nx1*100).toFixed(1)}%, ${(ny1*100).toFixed(1)}%`);
  } else {
    post('/api/swipe', {nx1, ny1, nx2, ny2, duration_ms: Math.min(1200, Date.now()-t0)});
    log('[ui] swipe');
  }
});
let lastHookMove = 0;
img.addEventListener('pointermove', e => {
  const now = performance.now();
  if (now - lastHookMove < 16) return;
  lastHookMove = now; hookPointer('mouseMove', e);
});
img.addEventListener('wheel', e => {
  hookPointer('mouseWheel', e, {delta:Math.round(-e.deltaY)});
}, {passive:true});
img.addEventListener('contextmenu', e => e.preventDefault());

// ---- 截图轮询 ----
let shotTimer = null;
let deviceConnected = false;
let shotInFlight = false;
let shotPending = false;
let shotEtag = '';
async function refreshShot() {
  clearTimeout(shotTimer);
  if (shotInFlight) { shotPending = true; return; }
  if (!deviceConnected) {
    $('#shotinfo').textContent = '设备未连接（预览已暂停）';
    schedule(); return;
  }
  if (document.hidden) { $('#shotinfo').textContent = '页面后台（预览已暂停）'; return; }
  shotInFlight = true;
  try {
    const t0 = performance.now();
    const r = await fetch(`/api/screenshot?annotate=${$('#annotate').checked?1:0}&w=1024&q=60`, {
      cache:'no-cache', headers: shotEtag ? {'If-None-Match': shotEtag} : {}
    });
    if (r.status === 304) {
      $('#shotinfo').textContent = `${Math.round(performance.now()-t0)} ms · 未变化`;
      return;
    }
    if (!r.ok) throw new Error((await r.json()).error);
    const blob = await r.blob();
    if (blob.size) {
      const old = img.src; img.src = URL.createObjectURL(blob);
      if (old && old.startsWith('blob:')) URL.revokeObjectURL(old);
    }
    shotEtag = r.headers.get('etag') || shotEtag;
    const age = r.headers.get('x-screenshot-frame-age-ms');
    $('#shotinfo').textContent = `${Math.round(performance.now()-t0)} ms · ${(blob.size/1024)|0} KB` +
      (age ? ` · 帧龄 ${age} ms` : '');
  } catch (e) {
    $('#shotinfo').textContent = `截图失败: ${e.message}`;
  } finally {
    shotInFlight = false;
    if (shotPending) { shotPending = false; schedule(0); }
    else schedule();
  }
}
function schedule(delay = null) {
  clearTimeout(shotTimer);
  const iv = +$('#fps').value;
  if (iv > 0 && !document.hidden) shotTimer = setTimeout(refreshShot, delay ?? iv);
}
$('#fps').onchange = () => { shotPending = false; clearTimeout(shotTimer); refreshShot(); };
document.addEventListener('visibilitychange', () => {
  clearTimeout(shotTimer);
  if (!document.hidden) refreshShot();
});
refreshShot();

// ---- 状态/任务 ----
async function refreshStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    if (s.error) throw new Error(s.error);
    const d = s.device, tag = $('#taskTag'), t = s.task || {state:'idle'};
    deviceConnected = !!s.connected;
    $('#statline').textContent =
      `${d.status} · ${d.orientation} · ${s.transform.w}x${s.transform.h} (scale ${s.transform.scale})` +
      (t.kind ? ` · 任务: ${t.kind}` : '');
    tag.className = 'tag ' + t.state; tag.textContent = t.state + (t.error ? `: ${t.error.slice(0,60)}` : '');
  } catch (e) { $('#statline').textContent = `未连接: ${e.message}`; }
}
setInterval(refreshStatus, 4000); refreshStatus();
async function connectDevice() {
  const response = await post('/api/connect');
  if (response.ok) {
    deviceConnected = true;
    await refreshStatus();
    shotPending = false; clearTimeout(shotTimer); refreshShot();
  }
}

// ---- 脚本列表 ----
async function loadScripts() {
  const kind = $('#kind').value;
  const all = await (await fetch('/api/scripts')).json();
  const ul = $('#scriptList'); ul.innerHTML = '';
  (all[kind] || []).forEach(it => {
    const li = document.createElement('li');
    const name = document.createElement('span');
    name.className = 'name'; name.textContent = it.name; name.title = it.path;
    const v = document.createElement('span'); v.className = 'v';
    v.textContent = it.verdict ? it.verdict.slice(0, 2) : (it.version || '');
    const btn = document.createElement('button'); btn.textContent = '运行';
    btn.onclick = () => post('/api/run', {kind, path: it.path});
    li.append(name, v, btn); ul.append(li);
  });
  if (!ul.children.length) ul.innerHTML = '<li style="color:var(--dim)">（空：先用下方转换，或 bgi-touch convert）</li>';
}
loadScripts();

async function convert() {
  const src = $('#convSrc').value.trim();
  if (!src) return;
  const r = await post('/api/convert', {source: src});
  if (r.ok) { loadScripts(); }
}

// ---- 触发器 ----
async function setTrigger() {
  await post('/api/triggers', {AutoPick: $('#trigPick').checked, AutoSkip: $('#trigSkip').checked,
                                AutoEat: $('#trigEat').checked,
                                QuickTeleport: $('#trigQuickTp').checked});
}
(async () => {
  try {
    const d = await (await fetch('/api/triggers')).json();
    $('#trigPick').checked = (d.active||[]).includes('AutoPick');
    $('#trigSkip').checked = (d.active||[]).includes('AutoSkip');
    $('#trigEat').checked = (d.active||[]).includes('AutoEat');
    $('#trigSkillCd').checked = (d.active||[]).includes('SkillCd');
    $('#trigQuickTp').checked = (d.active||[]).includes('QuickTeleport');
  } catch {}
})();

// ---- 技能冷却：只轮询内存快照，不触碰 DeviceHub 截图器 ----
let skillCdState = null;
function refXToPreview(x, width, height) {
  const scale = height / 1080;
  if (x < 640) return x * scale;
  if (x > 1280) return width - (1920 - x) * scale;
  return width / 2 + (x - 960) * scale;
}
function renderSkillCd(state) {
  skillCdState = state;
  $('#trigSkillCd').checked = !!state.active;
  const layer = $('#skillCdLayer'); layer.innerHTML = '';
  if (!state.active || !state.visible || !img.clientWidth || !img.clientHeight) return;
  const config = state.config || {};
  const factor = img.clientHeight / 1080;
  const baseX = refXToPreview(+config.pX || 0, img.clientWidth, img.clientHeight);
  const baseY = (+config.pY || 0) * factor;
  (state.team || []).forEach((avatar, index) => {
    if (!avatar.visible) return;
    const ready = !!avatar.ready;
    const value = document.createElement('div'); value.className = 'skill-cd';
    value.textContent = Number(avatar.remaining || 0).toFixed(1);
    value.title = `${avatar.slot}. ${avatar.name}`;
    value.style.left = `${baseX}px`;
    value.style.top = `${baseY + index * (+config.gap || 0) * factor}px`;
    value.style.transform = `scale(${+config.scale || 0})`;
    value.style.transformOrigin = 'top left';
    value.style.background = ready ? config.backgroundReadyColor : config.backgroundNormalColor;
    value.style.color = ready ? config.textReadyColor : config.textNormalColor;
    layer.append(value);
  });
}
async function setSkillCd() {
  const response = await post('/api/skill-cd', {enabled: $('#trigSkillCd').checked});
  if (response.ok) renderSkillCd(await response.json());
}
async function pollSkillCd() {
  try {
    const state = await (await fetch('/api/skill-cd', {cache:'no-store'})).json();
    if (!state.error) renderSkillCd(state);
  } catch {}
  setTimeout(pollSkillCd, 500);
}
pollSkillCd();

// ---- 地图遮罩：只轮询定位快照与本地地图，不触碰 DeviceHub 截图器 ----
let mapCatalog = [];
let mapState = null;
let mapImageKey = '';
let mapImageFailed = false;
const mapImage = new Image();
mapImage.decoding = 'async';
mapImage.onload = () => { mapImageFailed = false; drawMap(); };
mapImage.onerror = () => {
  mapImageFailed = true;
  $('#mapInfo').textContent = '地图图像加载失败';
  drawMap();
};

async function loadMapCatalog() {
  try {
    const data = await (await fetch('/api/map-mask/maps')).json();
    if (data.error) throw new Error(data.error);
    mapCatalog = data.maps || [];
    const select = $('#mapName'); select.innerHTML = '';
    mapCatalog.forEach(item => {
      const option = document.createElement('option');
      option.value = item.name;
      option.textContent = item.displayName + (item.available ? '' : '（无显示图）');
      select.append(option);
    });
  } catch (error) {
    $('#mapInfo').textContent = `地图目录失败: ${error.message}`;
  }
}

function activeMapLayer(state) {
  const map = mapCatalog.find(item => item.name === state?.mapName);
  if (!map) return null;
  return (map.layers || []).find(item => item.id === state.layer) ||
         (map.layers || []).find(item => item.id === 0) || map.layers?.[0] || null;
}

function ensureMapImage(state) {
  const layer = activeMapLayer(state);
  if (!layer) {
    mapImageKey = `${state?.mapName || 'unknown'}:none`;
    mapImageFailed = true;
    return;
  }
  const key = `${state.mapName}:${layer.id}`;
  if (key === mapImageKey) return;
  mapImageKey = key; mapImageFailed = false; mapImage.src = layer.url;
}

function drawMap() {
  const canvas = $('#mapCanvas');
  const cssWidth = Math.max(320, Math.round(canvas.clientWidth || 640));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const width = Math.round(cssWidth * dpr), height = Math.round(cssWidth * 9 / 16 * dpr);
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width; canvas.height = height;
  }
  const context = canvas.getContext('2d');
  context.clearRect(0, 0, width, height);
  context.fillStyle = '#0c0f13'; context.fillRect(0, 0, width, height);
  if (!mapState?.active || mapImageFailed || !mapImage.complete || !mapImage.naturalWidth) return;

  const position = mapState.position;
  const viewport = mapState.viewport;
  if (!position || !viewport || !mapState.positionValid) return;
  let sx = viewport.x, sy = viewport.y;
  let sw = Math.max(1, viewport.width), sh = Math.max(1, viewport.height);
  const targetRatio = width / height;
  if (sw / sh < targetRatio) {
    const expanded = sh * targetRatio; sx -= (expanded - sw) / 2; sw = expanded;
  } else {
    const expanded = sw / targetRatio; sy -= (expanded - sh) / 2; sh = expanded;
  }
  if (sw > mapImage.naturalWidth) { sx = 0; sw = mapImage.naturalWidth; }
  else sx = Math.max(0, Math.min(sx, mapImage.naturalWidth - sw));
  if (sh > mapImage.naturalHeight) { sy = 0; sh = mapImage.naturalHeight; }
  else sy = Math.max(0, Math.min(sy, mapImage.naturalHeight - sh));
  context.drawImage(mapImage, sx, sy, sw, sh, 0, 0, width, height);

  const px = (position.imageX - sx) / sw * width;
  const py = (position.imageY - sy) / sh * height;
  context.beginPath(); context.arc(px, py, 8 * dpr, 0, Math.PI * 2);
  context.fillStyle = '#4da3ff'; context.fill();
  context.lineWidth = 3 * dpr; context.strokeStyle = '#fff'; context.stroke();
}

function applyMapState(state) {
  const redraw = !mapState || state.sequence !== mapState.sequence ||
                 state.active !== mapState.active || state.mapName !== mapState.mapName ||
                 state.layer !== mapState.layer;
  mapState = state;
  $('#trigMap').checked = !!state.active;
  if (state.active && $('#mapName').value !== state.mapName) $('#mapName').value = state.mapName;
  ensureMapImage(state); if (redraw) drawMap();
  if (!state.active) {
    $('#mapInfo').textContent = '追踪未启用；地图面板不会主动请求设备截图。'; return;
  }
  const scene = {waiting:'等待帧', gameplay:'主界面', bigMap:'大地图', other:'其他界面'}[state.scene] || state.scene;
  const p = state.position;
  const noImage = activeMapLayer(state) ? '' : ' · 无本地底图';
  $('#mapInfo').textContent = p && state.positionValid
    ? `${scene} · ${state.mapName} 层 ${state.layer} · 世界坐标 (${p.worldX.toFixed(1)}, ${p.worldY.toFixed(1)}) · 状态龄 ${state.ageMs} ms${noImage}`
    : `${scene} · 等待有效定位${state.error ? ` · ${state.error}` : ''}${noImage}`;
}

async function setMapMask() {
  const response = await post('/api/map-mask', {
    enabled: $('#trigMap').checked,
    mapName: $('#mapName').value,
    miniMapMaskEnabled: true
  });
  if (response.ok) applyMapState(await response.json());
}
function mapSelectionChanged() { if ($('#trigMap').checked) setMapMask(); }

async function pollMapMask() {
  try {
    const state = await (await fetch('/api/map-mask', {cache:'no-store'})).json();
    if (!state.error || 'active' in state) applyMapState(state);
  } catch {}
  setTimeout(pollMapMask, 1000);
}
loadMapCatalog().then(pollMapMask);
window.addEventListener('resize', () => {
  if (mapState?.active) drawMap();
  if (skillCdState) renderSkillCd(skillCdState);
});

// ---- 日志轮询 ----
let logSeq = 0;
function log(msg) { const el = $('#logs');
  el.textContent += `${new Date().toTimeString().slice(0,8)} ${msg}\n`; el.scrollTop = el.scrollHeight; }
async function pollLogs() {
  try {
    const d = await (await fetch(`/api/logs?after=${logSeq}`)).json();
    if (d.logs.length) {
      const el = $('#logs');
      d.logs.forEach(l => { el.textContent += `${l.t} ${l.msg}\n`; });
      el.scrollTop = el.scrollHeight; logSeq = d.seq;
    }
  } catch {}
  setTimeout(pollLogs, 1500);
}
pollLogs();

// ---- BetterGI HTML 遮罩：长轮询消息，不触碰截图器 ----
const maskFrames = new Map();
let maskSeq = 0;
function maskAssetUrl(item) {
  const id = encodeURIComponent(item.id);
  const path = item.entry.split('/').map(encodeURIComponent).join('/');
  return `/api/html-masks/${id}/files/${path}`;
}
function ensureMask(item) {
  let state = maskFrames.get(item.id);
  if (!state) {
    const shell = document.createElement('div'); shell.className = 'mask-shell';
    const iframe = document.createElement('iframe');
    iframe.setAttribute('allow', 'clipboard-read; clipboard-write');
    const close = document.createElement('button'); close.className = 'mask-close'; close.textContent = '关闭遮罩';
    close.onclick = () => post(`/api/html-masks/${encodeURIComponent(item.id)}/close`);
    shell.append(iframe, close); $('#maskLayer').append(shell);
    state = {shell, iframe, loaded:false, pending:[]};
    iframe.onload = () => {
      state.loaded = true;
      state.pending.splice(0).forEach(message => dispatchMask(item.id, message));
    };
    iframe.src = maskAssetUrl(item);
    maskFrames.set(item.id, state);
  }
  state.shell.classList.toggle('click-through', !!item.clickThrough);
  return state;
}
function dispatchMask(id, message) {
  const state = maskFrames.get(id); if (!state) return;
  if (!state.loaded) { state.pending.push(message); return; }
  state.iframe.contentWindow.postMessage(
    {type:'bgi-html-mask-host', windowId:id, message}, location.origin);
}
function syncMasks(windows) {
  const active = new Set(windows.map(item => item.id));
  for (const [id, state] of maskFrames) {
    if (!active.has(id)) { state.shell.remove(); maskFrames.delete(id); }
  }
  windows.forEach(item => {
    ensureMask(item);
    (item.messages || []).forEach(message => dispatchMask(item.id, message));
  });
}
window.addEventListener('message', event => {
  if (event.origin !== location.origin) return;
  const message = event.data || {};
  if (message.type === 'bgi-key-mouse-hook') {
    hookEvent(message.event || {}); return;
  }
  if (message.type !== 'bgi-html-mask' || !maskFrames.has(message.windowId)) return;
  post(`/api/html-masks/${encodeURIComponent(message.windowId)}/message`, {
    url: message.url || '', data: message.data,
    requestId: message.requestId || null
  });
});
async function pollMasks() {
  try {
    const response = await fetch(`/api/html-masks/events?after=${maskSeq}`, {cache:'no-store'});
    const data = await response.json();
    if (!response.ok || data.error) throw new Error(data.error || response.status);
    maskSeq = data.seq; syncMasks(data.windows || []);
  } catch (error) {
    await new Promise(resolve => setTimeout(resolve, 1000));
  }
  pollMasks();
}
pollMasks();
</script>
